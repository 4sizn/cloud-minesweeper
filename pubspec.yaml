name: cloud_minesweeper
description: "Collect the clouds you solve, and arrange your own sky."
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: ^3.13.4

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.8.5
  flutter_rotation_sensor: ^0.4.0
  google_mobile_ads: ^9.1.0
  image: ^4.10.1
  path_provider: ^2.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/sky.frag
  assets:
    - assets/sky.png
    - assets/models/sky_u2netp_v1.onnx
    - assets/models/cloud_coco_v1.onnx
    - assets/licenses/
